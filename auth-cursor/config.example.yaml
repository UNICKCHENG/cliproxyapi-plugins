# Example CLIProxyAPI configuration for the auth-cursor plugin.
# Merge the `plugins` block into your own config.yaml.

host: "127.0.0.1"
port: 8317
auth-dir: "~/.cli-proxy-api"
api-keys:
  - "your-inbound-api-key"

# Credential selection strategy. Weights in the plugin block below only apply while this is
# "weighted-round-robin"; the default round-robin ignores them.
routing:
  strategy: "weighted-round-robin"

plugins:
  enabled: true
  # Relative "plugins" and "~" fail under brew services / launchd (CWD is often
  # "/", which is read-only). Use an absolute writable path instead:
  # dir: "/Users/<you>/.cli-proxy-api/plugins"
  dir: "plugins"
  # Plugin store source for this plugin. Drop it if you install from source.
  store-sources:
    - "https://raw.githubusercontent.com/UNICKCHENG/cliproxyapi-plugins/main/registry.json"
  configs:
    # The plugin id, which the host derives from the library file name. This is not the
    # provider key used by credentials below.
    auth-cursor:
      enabled: true
      # Path to the cursor-sdk-bridge executable, or to the directory holding it. Empty
      # downloads the pinned release into the user cache directory on first use,
      # <cache>/cli-proxy-api/auth-cursor-bridge/<bridge-version>/
      # (~/Library/Caches on macOS, ~/.cache on Linux, %LocalAppData% on Windows).
      bridge-path: ""
      # Proxy for credentials whose auth file sets no proxy_url. The bridge connects to
      # Cursor itself rather than through the host's HTTP client, so the host-level
      # proxy-url does not reach it and has to be restated here.
      proxy-url: ""
      # Cursor Router mode applied to the auto-smart model: cost | balanced | intelligence.
      optimize-for: "balanced"
      # Per-credential weighted-round-robin share. Keys are matched case-insensitively
      # against the account email first, then the auth file name with and without ".json".
      # Omitted credentials use the host default of 1; 0 or a negative value parks the
      # credential while the weighted strategy is active; the maximum is 1000000.
      # Weights live here rather than in the auth file because `--cursor-login` rewrites
      # that file. Do not also set "weight" in the auth file: the file wins if you do.
      weights: {}
      # weights:
      #   you@example.com: 5
      #   teammate@example.com: 2
      #   cursor-service-account.json: 1

# Model aliases and exclusions for Cursor credentials. The provider key is `cursor`, not
# the plugin id, and both blocks are host-level rather than part of the plugin config.
# oauth-model-alias:
#   cursor:
#     - name: "grok-4.6"        # upstream model id reported by Cursor
#       alias: "grok-latest"    # client-visible id
#       # fork: true            # keep the upstream id and expose the alias as well
#       # display-name: "Grok Latest"
#
# oauth-excluded-models:
#   cursor:
#     - "grok-4.5"

# Credentials live in auth-dir, one JSON file per Cursor API key. Create the key in the
# Cursor dashboard, then either run `cli-proxy-api --cursor-login` and paste it, or write
# the file yourself. Note that "type" is the provider key `cursor`, not the plugin id
# `auth-cursor`:
#
#   $(auth-dir)/cursor-*.json
#   {"type": "cursor", "api_key": "key_..."}
#
# Optional fields: label, prefix, proxy_url, disabled, note, and the per-account
# model_aliases / excluded-models lists. Re-running --cursor-login preserves them.
#
# proxy_url in the auth file routes that one account's Cursor traffic through its own
# proxy, overriding the plugin-level proxy-url above.
